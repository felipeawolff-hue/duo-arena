<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Duo Arena</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#1a1512;--surface:#252019;--surface2:#302a22;
  --green:#78e510;--green-dim:#3a6e0a;--gold:#f5c542;--silver:#b8b8b8;--bronze:#c47a2e;
  --red:#e5564a;--text:#ede8e0;--dim:#9a9185;--border:#3a342c;
}
body{background:var(--bg);color:var(--text);font-family:'Nunito',system-ui,sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased}

/* Login */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{background:var(--surface);border-radius:20px;padding:44px 32px 36px;width:100%;max-width:380px}
.logo{text-align:center;margin-bottom:28px}
.logo-icon{font-size:64px;display:block;margin-bottom:4px}
.logo-title{font-size:32px;font-weight:900;color:var(--green);line-height:1}
.logo-sub{color:var(--dim);font-size:15px;margin-top:6px;font-weight:400}
.field{margin-bottom:18px}
.field label{display:block;font-size:13px;color:var(--dim);font-weight:700;margin-bottom:8px}
.field input{width:100%;background:var(--bg);border:2px solid var(--border);border-radius:12px;padding:14px 16px;color:var(--text);font-size:16px;font-family:inherit;outline:none;transition:border-color .2s}
.field input:focus{border-color:var(--green)}
.btn-main{width:100%;background:var(--green);color:var(--bg);border:none;border-radius:12px;padding:16px 0;font-size:17px;font-weight:800;cursor:pointer;font-family:inherit;transition:transform .1s}
.btn-main:active{transform:scale(.97)}
.btn-main:disabled{opacity:.4;cursor:default;transform:none}

/* Log */
.log{background:var(--bg);border-radius:10px;padding:10px 12px;margin-top:14px;max-height:120px;overflow-y:auto;font-family:'Courier New',monospace;font-size:12px;line-height:1.5}
.log div{margin-bottom:1px}
.log .ok{color:var(--green)}.log .err{color:var(--red)}.log .warn{color:var(--gold)}.log .info{color:var(--dim)}

/* Dashboard */
.dash{max-width:600px;margin:0 auto;padding:24px 16px 48px}
.dash-top{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:28px}
.dash-title{font-size:26px;font-weight:900;color:var(--text);line-height:1.1}
.dash-title span{color:var(--green)}
.dash-count{font-size:13px;color:var(--dim);margin-top:4px;font-weight:400}
.btn-add{background:var(--surface2);border:none;color:var(--green);border-radius:10px;padding:10px 18px;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit;transition:background .15s}
.btn-add:hover{background:var(--border)}

.add-panel{background:var(--surface);border-radius:14px;padding:16px;margin-bottom:20px}
.add-row{display:flex;gap:8px}
.add-row input{flex:1;background:var(--bg);border:2px solid var(--border);border-radius:10px;padding:12px 14px;color:var(--text);font-size:15px;font-family:inherit;outline:none}
.add-row input:focus{border-color:var(--green)}
.add-row button{background:var(--green);color:var(--bg);border:none;border-radius:10px;padding:0 20px;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit}

/* Podium */
.podium{display:flex;align-items:flex-end;justify-content:center;gap:6px;margin:0 0 32px;padding:0 8px}
.pod{flex:1;display:flex;flex-direction:column;align-items:center;max-width:140px}
.pod-emoji{line-height:1}
.pod-name{color:var(--text);font-size:14px;font-weight:800;margin:6px 0 2px;text-align:center;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod-xp{font-weight:800;font-size:13px;margin-bottom:6px}
.pod-bar{width:100%;border-radius:10px 10px 0 0;display:flex;align-items:center;justify-content:center}
.pod-bar span{font-size:32px;font-weight:900;opacity:.7}
.pod-1 .pod-xp{color:var(--gold)}.pod-2 .pod-xp{color:var(--silver)}.pod-3 .pod-xp{color:var(--bronze)}
.pod-1 .pod-bar{background:linear-gradient(180deg,#f5c54233,var(--surface));border-top:3px solid var(--gold)}
.pod-2 .pod-bar{background:linear-gradient(180deg,#b8b8b833,var(--surface));border-top:3px solid var(--silver)}
.pod-3 .pod-bar{background:linear-gradient(180deg,#c47a2e33,var(--surface));border-top:3px solid var(--bronze)}

/* Player cards */
.players{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border-radius:14px;padding:18px 20px}
.card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.card-who{display:flex;align-items:center;gap:12px}
.card-rank{font-size:20px;font-weight:900;min-width:28px}
.card-name{font-size:16px;font-weight:800;display:block;line-height:1.2}
.card-user{color:var(--dim);font-size:12px;font-weight:400}
.card-actions{display:flex;gap:4px}
.btn-sm{background:none;border:none;color:var(--dim);font-size:16px;width:30px;height:30px;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s}
.btn-sm:hover{background:var(--surface2)}
.btn-sm.rm:hover{color:var(--red)}

/* Stats */
.stats{display:flex;gap:20px;padding:0 4px}
.stat{display:flex;align-items:baseline;gap:6px}
.stat-icon{font-size:16px}
.stat-num{font-size:22px;font-weight:900;line-height:1}
.stat-lbl{font-size:11px;color:var(--dim);font-weight:700}
.stat-streak .stat-num{color:var(--gold)}
.stat-xp .stat-num{color:var(--green)}

/* Courses progress table */
.crs-table{width:100%;border-collapse:collapse;margin-top:14px;font-size:13px}
.crs-table thead th{text-align:left;color:var(--dim);font-size:11px;font-weight:700;padding:0 6px 6px;border-bottom:1px solid var(--border)}
.crs-table thead th:nth-child(3),.crs-table thead th:nth-child(4){text-align:right}
.crs-table tbody tr:hover{background:var(--surface2)}
.crs-table td{padding:6px;vertical-align:middle}
.crs-lang{font-weight:700;color:var(--text);white-space:nowrap}
.crs-bar-cell{width:35%}
.crs-bar-bg{background:var(--bg);border-radius:4px;height:8px;overflow:hidden}
.crs-bar-fill{background:var(--green);height:100%;border-radius:4px;min-width:2px;transition:width .3s}
.crs-prog-text{font-size:10px;color:var(--dim);font-weight:700;display:block;margin-top:2px}
.crs-from{font-weight:400;color:var(--dim);font-size:11px}
.crs-xp{text-align:right;color:var(--dim);font-weight:700;white-space:nowrap}
.crs-delta{text-align:right;color:var(--dim);font-weight:800;white-space:nowrap}
.crs-up{color:var(--green)}

.meta{font-size:11px;color:var(--dim);margin-top:10px;text-align:right;font-weight:400}

@keyframes spin{to{transform:rotate(360deg)}}
.spinner{animation:spin .8s linear infinite}
.hidden{display:none}
</style>
</head>
<body>

<div id="login-screen" class="login-wrap">
  <div class="login-card">
    <div class="logo">
      <span class="logo-icon">🦉</span>
      <h1 class="logo-title">Duo Arena</h1>
      <p class="logo-sub">Competição em família</p>
    </div>
    <div class="field">
      <label>Username do Duolingo</label>
      <input id="login-input" placeholder="ex: FelipeWolf2">
    </div>
    <button class="btn-main" id="login-btn" onclick="handleLogin()">Entrar na arena</button>
    <div id="login-log" class="log hidden"></div>
  </div>
</div>

<div id="dash-screen" class="dash hidden">
  <div class="dash-top">
    <div>
      <h1 class="dash-title">🦉 Duo <span>Arena</span></h1>
      <p id="dash-count" class="dash-count"></p>
    </div>
    <button class="btn-add" id="add-toggle" onclick="toggleAdd()">+ Adicionar</button>
  </div>
  <div id="add-panel" class="add-panel hidden">
    <div class="add-row">
      <input id="add-input" placeholder="Username do Duolingo">
      <button onclick="handleAdd()">Buscar</button>
    </div>
    <div id="add-log" class="log hidden"></div>
  </div>
  <div id="podium" class="podium hidden"></div>
  <div id="player-list" class="players"></div>
</div>

<script>
const DUO_API = "https://tacianawolff.com.br/duo-arena/api/duolingo?username=";
const STORE_KEY = "duo-arena-players";
let players = [];

function loadPlayers() {
  try { players = JSON.parse(localStorage.getItem(STORE_KEY)) || []; } catch { players = []; }
}
function savePlayers() { localStorage.setItem(STORE_KEY, JSON.stringify(players)); }

async function fetchDuo(username, logEl) {
  log(logEl, "info", "Buscando " + username + "...");
  try {
    const r = await fetch(DUO_API + encodeURIComponent(username));
    if (!r.ok) { log(logEl, "err", "HTTP " + r.status); return null; }
    const d = await r.json();
    if (!d.users || !d.users.length) { log(logEl, "warn", "Usuário não encontrado ou perfil privado."); return null; }
    const u = d.users[0];
    log(logEl, "ok", "Encontrado: " + (u.name || u.username));
    return {
      username: u.username || username,
      displayName: u.name || u.username,
      streak: u.streak || 0,
      totalXp: u.totalXp || 0,
      courses: (u.courses || []).map(c => ({ language: c.title || c.learningLanguage || "?", xp: c.xp || 0, from: c.fromLanguage || "?", code: c.learningLanguage || "?" })),
      lastUpdated: Date.now()
    };
  } catch (e) { log(logEl, "err", e.message); return null; }
}

function log(el, cls, msg) {
  if (!el) return;
  el.classList.remove("hidden");
  const d = document.createElement("div"); d.className = cls;
  d.textContent = (cls==="ok"?"✅ ":cls==="err"?"❌ ":cls==="warn"?"⚠️ ":"") + msg;
  el.appendChild(d); el.scrollTop = el.scrollHeight;
}

async function handleLogin() {
  const input = document.getElementById("login-input");
  const logEl = document.getElementById("login-log");
  const btn = document.getElementById("login-btn");
  const username = input.value.trim();
  if (!username) return;
  logEl.innerHTML = ""; btn.disabled = true;
  btn.innerHTML = '<svg class="spinner" width="18" height="18" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="3" stroke-dasharray="31.4" stroke-linecap="round"/></svg> Buscando...';
  const result = await fetchDuo(username, logEl);
  if (result) {
    const exists = players.find(p => p.username.toLowerCase() === result.username.toLowerCase());
    if (!exists) { result.baselineXp = result.totalXp; result.baselineCourses = Object.fromEntries((result.courses||[]).map(c=>[c.language,c.xp])); players.push(result); savePlayers(); }
    showDashboard();
  }
  btn.disabled = false; btn.textContent = "Entrar na arena";
}

async function handleAdd() {
  const input = document.getElementById("add-input");
  const logEl = document.getElementById("add-log");
  const username = input.value.trim();
  if (!username) return;
  logEl.innerHTML = "";
  if (players.find(p => p.username.toLowerCase() === username.toLowerCase())) { log(logEl, "warn", "Já está na arena!"); return; }
  const result = await fetchDuo(username, logEl);
  if (result) {
    result.baselineXp = result.totalXp;
    result.baselineCourses = Object.fromEntries((result.courses||[]).map(c=>[c.language,c.xp]));
    players.push(result); savePlayers();
    input.value = "";
    document.getElementById("add-panel").classList.add("hidden");
    document.getElementById("add-log").classList.add("hidden");
    renderDashboard();
  }
}

function toggleAdd() {
  const p = document.getElementById("add-panel"); p.classList.toggle("hidden");
  if (!p.classList.contains("hidden")) document.getElementById("add-input").focus();
}

async function refreshPlayer(username) {
  const btn = document.querySelector('[data-r="'+username+'"]');
  if (btn) btn.innerHTML = '<svg class="spinner" width="14" height="14" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="3" stroke-dasharray="31.4" stroke-linecap="round"/></svg>';
  const result = await fetchDuo(username, null);
  if (result) {
    players = players.map(p => {
      if (p.username.toLowerCase() === username.toLowerCase()) {
        result.baselineXp = p.baselineXp ?? p.totalXp;
        result.baselineCourses = p.baselineCourses ?? Object.fromEntries((p.courses||[]).map(c=>[c.language,c.xp]));
        return result;
      }
      return p;
    });
    savePlayers();
  }
  renderDashboard();
}

function removePlayer(u) {
  players = players.filter(p => p.username.toLowerCase() !== u.toLowerCase());
  savePlayers();
  if (!players.length) showLogin(); else renderDashboard();
}

function showLogin() {
  document.getElementById("login-screen").classList.remove("hidden");
  document.getElementById("dash-screen").classList.add("hidden");
}
function showDashboard() {
  document.getElementById("login-screen").classList.add("hidden");
  document.getElementById("dash-screen").classList.remove("hidden");
  renderDashboard();
}

// Total units per language code (from duocorner.com, path system)
const UNITS = {ar:36,zh:63,cs:63,da:46,nl:85,eo:45,fi:29,fr:225,de:137,el:67,ht:29,haw:30,he:60,hi:27,hu:77,id:50,ga:48,it:72,ja:131,tlh:48,ko:78,la:20,nv:13,nb:165,pl:49,pt:81,ro:46,ru:67,gd:75,es:236,sw:53,sv:61,tr:49,uk:39,vi:55,cy:75,yi:67,zu:19,en:200};
const XP_PER_UNIT = 75; // ~5-8 lições × ~12 XP

function courseProgress(code, xp) {
  const total = UNITS[code];
  if (!total) return null;
  const estUnit = Math.min(Math.round(xp / XP_PER_UNIT), total);
  return { current: estUnit, total, pct: Math.round((estUnit / total) * 100) };
}

function deltaXP(p) { return (p.totalXp || 0) - (p.baselineXp ?? p.totalXp ?? 0); }
function fmtXP(xp) { return xp == null ? "—" : xp >= 1000 ? (xp/1000).toFixed(1)+"k" : String(xp); }
function esc(s) { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }

function renderDashboard() {
  const sorted = [...players].sort((a, b) => deltaXP(b) - deltaXP(a));
  document.getElementById("dash-count").textContent = players.length + " competidor" + (players.length !== 1 ? "es" : "");

  const podium = document.getElementById("podium");
  if (sorted.length >= 2) {
    const mc = ["gold","silver","bronze"];
    const icons = ["👑","🥈","🥉"];
    const h = {0: 140, 1: 100, 2: 65};
    podium.innerHTML = [1,0,2].map(idx => {
      const p = sorted[idx];
      if (!p) return '<div style="flex:1"></div>';
      return `<div class="pod pod-${idx+1}">
        <span class="pod-emoji" style="font-size:${idx===0?42:28}px">${icons[idx]}</span>
        <span class="pod-name">${esc(p.displayName||p.username)}</span>
        <span class="pod-xp">+${fmtXP(deltaXP(p))} XP</span>
        <div class="pod-bar" style="height:${h[idx]}px"><span>${idx+1}</span></div>
      </div>`;
    }).join("");
    podium.classList.remove("hidden");
  } else { podium.classList.add("hidden"); }

  const mc = ["var(--gold)","var(--silver)","var(--bronze)"];
  document.getElementById("player-list").innerHTML = sorted.map((p, i) => {
    const rankColor = i < 3 ? mc[i] : "var(--dim)";
    const bl = p.baselineCourses || {};
    const courseRows = (p.courses || [])
      .filter(c => c.xp > 0)
      .sort((a,b) => b.xp - a.xp)
      .map(c => {
        const base = bl[c.language] || 0;
        const delta = c.xp - base;
        const prog = courseProgress(c.code, c.xp);
        const barHtml = prog
          ? `<div class="crs-bar-bg"><div class="crs-bar-fill" style="width:${prog.pct}%"></div></div><span class="crs-prog-text">${prog.current}/${prog.total}</span>`
          : `<div class="crs-bar-bg"><div class="crs-bar-fill" style="width:0%"></div></div>`;
        return `<tr>
          <td class="crs-lang">${esc(c.language)}<span class="crs-from">${c.from !== '?' ? ' (de '+c.from+')' : ''}</span></td>
          <td class="crs-bar-cell">${barHtml}</td>
          <td class="crs-xp">${fmtXP(c.xp)}</td>
          <td class="crs-delta ${delta>0?'crs-up':''}">${delta>0?'+':''}${fmtXP(delta)}</td>
        </tr>`;
      }).join("");
    const courseTable = courseRows ? `<table class="crs-table"><thead><tr><th>Idioma</th><th>Progresso</th><th>XP</th><th>Ganho</th></tr></thead><tbody>${courseRows}</tbody></table>` : "";
    const updated = p.lastUpdated ? `<p class="meta">${new Date(p.lastUpdated).toLocaleString("pt-BR")}</p>` : "";
    return `<div class="card">
      <div class="card-top">
        <div class="card-who">
          <span class="card-rank" style="color:${rankColor}">${i+1}</span>
          <div>
            <span class="card-name">${esc(p.displayName||p.username)}</span>
            <span class="card-user">@${esc(p.username)}</span>
          </div>
        </div>
        <div class="card-actions">
          <button class="btn-sm" data-r="${esc(p.username)}" onclick="refreshPlayer('${esc(p.username)}')">↻</button>
          <button class="btn-sm rm" onclick="removePlayer('${esc(p.username)}')">✕</button>
        </div>
      </div>
      <div class="stats">
        <div class="stat stat-streak"><span class="stat-icon">🔥</span><span class="stat-num">${p.streak??'—'}</span><span class="stat-lbl">streak</span></div>
        <div class="stat stat-xp"><span class="stat-icon">⚡</span><span class="stat-num">+${fmtXP(deltaXP(p))}</span><span class="stat-lbl">XP ganho</span></div>
        <div class="stat"><span class="stat-icon">🌍</span><span class="stat-num">${p.courses?.length??0}</span><span class="stat-lbl">idiomas</span></div>
      </div>
      ${courseTable}
      ${updated}
    </div>`;
  }).join("");
}

document.getElementById("login-input").addEventListener("keydown", e => { if(e.key==="Enter") handleLogin(); });
document.getElementById("add-input").addEventListener("keydown", e => { if(e.key==="Enter") handleAdd(); });
loadPlayers();
if (players.length) showDashboard(); else showLogin();
</script>
</body>
</html>
