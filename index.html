<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Duo Arena</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#1a1512;--surface:#252019;--surface2:#302a22;
  --green:#78e510;--green-dim:#3a6e0a;--gold:#f5c542;--silver:#b8b8b8;--bronze:#c47a2e;
  --red:#e5564a;--text:#ede8e0;--dim:#9a9185;--border:#3a342c;--blue:#1cb0f6;
}
body{background:var(--bg);color:var(--text);font-family:'Nunito',system-ui,sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased}

/* Log */
.log{background:var(--bg);border-radius:10px;padding:10px 12px;margin-top:10px;max-height:110px;overflow-y:auto;font-family:'Courier New',monospace;font-size:12px;line-height:1.5}
.log div{margin-bottom:1px}
.log .ok{color:var(--green)}.log .err{color:var(--red)}.log .warn{color:var(--gold)}.log .info{color:var(--dim)}

/* Dashboard */
.dash{max-width:640px;margin:0 auto;padding:24px 16px 48px}
.dash-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;gap:12px}
.dash-title{font-size:26px;font-weight:900;line-height:1.1}
.dash-title span{color:var(--green)}
.dash-count{font-size:13px;color:var(--dim);margin-top:4px;font-weight:400}
.btn-add{background:var(--surface2);border:none;color:var(--green);border-radius:10px;padding:10px 16px;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit;transition:background .15s;white-space:nowrap}
.btn-add:hover{background:var(--border)}

/* Add / reauth panel */
.side-panel{background:var(--surface);border-radius:14px;padding:18px 20px;margin-bottom:20px}
.side-panel h3{font-size:15px;font-weight:800;margin-bottom:10px}
.side-panel .help{background:var(--surface2);border-radius:8px;padding:10px 12px;margin-bottom:12px;font-size:11px;color:var(--dim);line-height:1.5}
.side-panel .help strong{color:var(--text);display:block;margin-bottom:4px;font-size:12px}
.side-panel .help ol{padding-left:18px}
.side-panel .help code{background:var(--bg);padding:1px 4px;border-radius:3px;color:var(--green);font-size:10px}
.side-panel input,.side-panel textarea{width:100%;background:var(--bg);border:2px solid var(--border);border-radius:10px;padding:10px 12px;color:var(--text);font-size:14px;font-family:inherit;outline:none;margin-bottom:8px;resize:vertical}
.side-panel textarea{min-height:70px;font-family:'Courier New',monospace;font-size:11px;line-height:1.4;word-break:break-all}
.side-panel input:focus,.side-panel textarea:focus{border-color:var(--green)}
.side-panel button{width:100%;background:var(--green);color:var(--bg);border:none;border-radius:10px;padding:11px 0;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit}

/* Empty state */
.empty{text-align:center;padding:60px 20px;color:var(--dim)}
.empty .big{font-size:56px;margin-bottom:16px}
.empty h2{font-size:20px;color:var(--text);margin-bottom:8px}
.empty p{font-size:14px;line-height:1.5}

/* Podium */
.podium{display:flex;align-items:flex-end;justify-content:center;gap:6px;margin:0 0 28px;padding:0 8px}
.pod{flex:1;display:flex;flex-direction:column;align-items:center;max-width:140px}
.pod-emoji{line-height:1}
.pod-name{color:var(--text);font-size:14px;font-weight:800;margin:6px 0 2px;text-align:center;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod-xp{font-weight:800;font-size:13px;margin-bottom:6px}
.pod-bar{width:100%;border-radius:10px 10px 0 0;display:flex;align-items:center;justify-content:center}
.pod-bar span{font-size:32px;font-weight:900;opacity:.7}
.pod-1 .pod-xp{color:var(--gold)}.pod-2 .pod-xp{color:var(--silver)}.pod-3 .pod-xp{color:var(--bronze)}
.pod-1 .pod-bar{background:linear-gradient(180deg,#f5c54233,var(--surface));border-top:3px solid var(--gold)}
.pod-2 .pod-bar{background:linear-gradient(180deg,#b8b8b833,var(--surface));border-top:3px solid var(--silver)}
.pod-3 .pod-bar{background:linear-gradient(180deg,#c47a2e33,var(--surface));border-top:3px solid var(--bronze)}

/* Cards */
.players{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border-radius:14px;padding:18px 20px}
.card.expired{border:1px solid var(--red)}
.card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.card-who{display:flex;align-items:center;gap:12px}
.card-rank{font-size:20px;font-weight:900;min-width:28px}
.card-name{font-size:16px;font-weight:800;display:block;line-height:1.2}
.card-user{color:var(--dim);font-size:12px;font-weight:400}
.card-actions{display:flex;gap:4px}
.btn-sm{background:none;border:none;color:var(--dim);font-size:16px;width:30px;height:30px;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s}
.btn-sm:hover{background:var(--surface2)}
.btn-sm.rm:hover{color:var(--red)}

/* Inline confirm (delete / reauth) */
.inline-panel{background:var(--surface2);border-radius:10px;padding:12px;margin-top:10px}
.inline-panel p{font-size:12px;font-weight:700;margin-bottom:8px}
.inline-panel p.warn{color:var(--red)}
.inline-panel textarea{width:100%;background:var(--bg);border:2px solid var(--border);border-radius:8px;padding:8px 10px;color:var(--text);font-size:11px;font-family:'Courier New',monospace;outline:none;margin-bottom:6px;min-height:60px;line-height:1.3;word-break:break-all}
.inline-panel .row{display:flex;gap:6px}
.inline-panel button{flex:1;border:none;border-radius:8px;padding:8px 0;font-size:13px;font-weight:800;cursor:pointer;font-family:inherit}
.inline-panel .ok-btn{background:var(--green);color:var(--bg)}
.inline-panel .rm-btn{background:var(--red);color:#fff}
.inline-panel .cancel-btn{background:var(--surface);color:var(--dim)}

/* Stats */
.stats{display:flex;gap:20px;padding:0 4px}
.stat{display:flex;align-items:baseline;gap:6px}
.stat-icon{font-size:16px}
.stat-num{font-size:22px;font-weight:900;line-height:1}
.stat-lbl{font-size:11px;color:var(--dim);font-weight:700}
.stat-streak .stat-num{color:var(--gold)}
.stat-xp .stat-num{color:var(--green)}

/* Courses table */
.crs-block{margin-top:14px}
.crs-head{font-size:10px;color:var(--dim);font-weight:800;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;padding:0 4px}
.crs-list{display:flex;flex-direction:column;gap:6px}
.crs-row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:7px 10px;border-radius:8px;background:var(--bg);font-size:13px}
.crs-row.active{background:linear-gradient(90deg,rgba(120,229,16,.08),var(--bg))}
.crs-name{font-weight:700;display:flex;align-items:center;gap:6px;min-width:0}
.crs-name .star{color:var(--green);font-size:12px}
.crs-name .lang{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crs-name small{font-weight:400;color:var(--dim);margin-left:4px;font-size:11px}
.crs-cefr{background:var(--blue);color:var(--bg);border-radius:4px;padding:1px 6px;font-size:10px;font-weight:800;margin-left:6px}
.crs-progress{display:flex;align-items:center;gap:8px;min-width:170px;justify-content:flex-end}
.crs-bar{background:var(--surface2);border-radius:4px;height:6px;width:80px;overflow:hidden}
.crs-bar-fill{background:var(--green);height:100%;border-radius:4px;transition:width .3s}
.crs-score{color:var(--text);font-weight:800;font-size:11px;min-width:44px;text-align:right;font-variant-numeric:tabular-nums}
.crs-xp{color:var(--dim);font-weight:700;font-size:12px;font-variant-numeric:tabular-nums}
.crs-delta{color:var(--green);font-weight:800;font-size:11px;font-variant-numeric:tabular-nums;min-width:38px;text-align:right}
.crs-delta.zero{color:var(--dim)}

.meta{font-size:11px;color:var(--dim);margin-top:12px;text-align:right;font-weight:400}

@keyframes spin{to{transform:rotate(360deg)}}
.spinner{animation:spin .8s linear infinite}
.hidden{display:none}
</style>
</head>
<body>

<div class="dash">
  <div class="dash-top">
    <div>
      <h1 class="dash-title">🦉 Duo <span>Arena</span></h1>
      <p id="dash-count" class="dash-count">carregando...</p>
    </div>
    <button class="btn-add" id="add-toggle" onclick="togglePanel()">+ Adicionar / Renovar</button>
  </div>

  <div id="panel" class="side-panel hidden">
    <h3 id="panel-title">Adicionar competidor</h3>
    <div class="help">
      <strong>Como pegar o token:</strong>
      <ol>
        <li>Abra <code>duolingo.com</code> logado</li>
        <li>F12 → <strong>Application</strong> → <strong>Cookies</strong> → <code>duolingo.com</code></li>
        <li>Copie o valor de <code>jwt_token</code> e cole abaixo</li>
      </ol>
    </div>
    <input id="panel-user" placeholder="Username do Duolingo" autocomplete="off">
    <textarea id="panel-jwt" placeholder="JWT token"></textarea>
    <button id="panel-btn" onclick="submitPanel()">Adicionar</button>
    <div id="panel-log" class="log hidden"></div>
  </div>

  <div id="empty" class="empty hidden">
    <div class="big">🦉</div>
    <h2>Arena vazia</h2>
    <p>Clique em <strong>+ Adicionar / Renovar</strong> pra cadastrar o primeiro competidor.</p>
  </div>

  <div id="podium" class="podium hidden"></div>
  <div id="player-list" class="players"></div>
</div>

<script>
const API_BASE = "https://tacianawolff.com.br/duo-arena/api";
const ARENA_URL = API_BASE + "/arena";
const TOKEN_URL = API_BASE + "/token";
const REFRESH_URL = API_BASE + "/refresh?username=";
const DELETE_URL = API_BASE + "/player";
const CACHE_KEY = "duo-arena-cache";
let players = [];

function log(el, cls, msg) {
  if (!el) return;
  el.classList.remove("hidden");
  const d = document.createElement("div"); d.className = cls;
  d.textContent = (cls==="ok"?"✅ ":cls==="err"?"❌ ":cls==="warn"?"⚠️ ":"") + msg;
  el.appendChild(d); el.scrollTop = el.scrollHeight;
}

function esc(s) { const d = document.createElement("div"); d.textContent = String(s == null ? "" : s); return d.innerHTML; }
function fmtXP(xp) { return xp == null ? "—" : xp >= 1000 ? (xp/1000).toFixed(1)+"k" : String(xp); }
function deltaXP(p) { return (p.totalXp || 0) - (p.baselineXp ?? p.totalXp ?? 0); }

async function loadArena() {
  // Warm from cache first for instant paint.
  try {
    const cached = JSON.parse(localStorage.getItem(CACHE_KEY) || "null");
    if (cached && Array.isArray(cached.players)) { players = cached.players; render(); }
  } catch {}
  try {
    const r = await fetch(ARENA_URL);
    if (!r.ok) throw new Error("HTTP " + r.status);
    const d = await r.json();
    players = d.players || [];
    localStorage.setItem(CACHE_KEY, JSON.stringify({players}));
    render();
  } catch (e) {
    document.getElementById("dash-count").textContent = "erro ao carregar arena";
  }
}

function togglePanel() {
  const p = document.getElementById("panel");
  p.classList.toggle("hidden");
  if (!p.classList.contains("hidden")) {
    document.getElementById("panel-title").textContent = "Adicionar / renovar competidor";
    document.getElementById("panel-user").focus();
    document.getElementById("panel-log").innerHTML = "";
    document.getElementById("panel-log").classList.add("hidden");
  }
}

async function submitPanel() {
  const userEl = document.getElementById("panel-user");
  const jwtEl = document.getElementById("panel-jwt");
  const btn = document.getElementById("panel-btn");
  const logEl = document.getElementById("panel-log");
  const username = userEl.value.trim();
  const jwt = jwtEl.value.trim();
  if (!username || !jwt) { log(logEl, "warn", "Preencha usuário e token."); return; }
  btn.disabled = true;
  logEl.innerHTML = "";
  log(logEl, "info", "Validando token...");
  try {
    const r = await fetch(TOKEN_URL, {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({username, jwt})});
    const d = await r.json();
    if (!d.success) { log(logEl, "err", d.error || "Token inválido"); btn.disabled = false; return; }
    log(logEl, "ok", d.isNew ? "Token salvo. Cadastrando..." : "Token renovado.");
    const rr = await fetch(REFRESH_URL + encodeURIComponent(d.username), {method:"POST"});
    if (!rr.ok) { log(logEl, "err", "Falha ao buscar dados (HTTP " + rr.status + ")"); btn.disabled = false; return; }
    const rd = await rr.json();
    if (rd.error === "expired") { log(logEl, "err", "Token não passou na 2ª verificação."); btn.disabled = false; return; }
    log(logEl, "ok", "Dados carregados.");
    jwtEl.value = "";
    userEl.value = "";
    document.getElementById("panel").classList.add("hidden");
    await loadArena();
  } catch (e) {
    log(logEl, "err", "Rede: " + e.message);
  }
  btn.disabled = false;
}

async function refreshPlayer(username) {
  const btn = document.querySelector('[data-r="'+username+'"]');
  const orig = btn ? btn.innerHTML : "↻";
  if (btn) btn.innerHTML = '<svg class="spinner" width="14" height="14" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="3" stroke-dasharray="31.4" stroke-linecap="round"/></svg>';
  try {
    const r = await fetch(REFRESH_URL + encodeURIComponent(username), {method:"POST"});
    if (r.status === 429) { alert("Muitas atualizações. Espere alguns minutos."); if (btn) btn.innerHTML = orig; return; }
    const d = await r.json();
    if (d.error === "expired") {
      const idx = players.findIndex(p => p.username.toLowerCase() === username.toLowerCase());
      if (idx !== -1) players[idx] = {...players[idx], expired: true};
      render();
      return;
    }
    if (d.player) {
      const idx = players.findIndex(p => p.username.toLowerCase() === username.toLowerCase());
      if (idx !== -1) players[idx] = d.player; else players.push(d.player);
      localStorage.setItem(CACHE_KEY, JSON.stringify({players}));
      render();
    }
  } catch (e) {
    if (btn) btn.innerHTML = orig;
    alert("Falha ao atualizar: " + e.message);
  }
}

function askReauth(username) {
  const el = document.getElementById("reauth-jwt-" + username);
  if (el) { el.focus(); return; }
  // Fallback: se o card não estiver marcado como expired, insere painel via botão.
  refreshPlayer(username);
}

async function submitReauth(username) {
  const el = document.getElementById("reauth-jwt-" + username);
  if (!el) return;
  const jwt = el.value.trim();
  if (!jwt) return;
  try {
    const r = await fetch(TOKEN_URL, {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({username, jwt})});
    const d = await r.json();
    if (!d.success) { alert(d.error || "Token inválido"); return; }
    // Server keeps baseline/data intact. Do a refresh to pull latest state.
    await refreshPlayer(username);
  } catch (e) { alert("Rede: " + e.message); }
}

function askDelete(username) {
  const idx = players.findIndex(p => p.username.toLowerCase() === username.toLowerCase());
  if (idx === -1) return;
  players[idx]._confirmDelete = !players[idx]._confirmDelete;
  render();
}

async function submitDelete(username) {
  const el = document.getElementById("del-jwt-" + username);
  if (!el) return;
  const jwt = el.value.trim();
  if (!jwt) { alert("Cole o JWT pra confirmar."); return; }
  try {
    const r = await fetch(DELETE_URL, {method:"DELETE", headers:{"Content-Type":"application/json"}, body: JSON.stringify({username, jwt})});
    const d = await r.json();
    if (r.status === 403) { alert("JWT não confere. Delete negado."); return; }
    if (!d.success) { alert("Falha ao remover."); return; }
    players = players.filter(p => p.username.toLowerCase() !== username.toLowerCase());
    localStorage.setItem(CACHE_KEY, JSON.stringify({players}));
    render();
  } catch (e) { alert("Rede: " + e.message); }
}

function cancelDelete(username) {
  const idx = players.findIndex(p => p.username.toLowerCase() === username.toLowerCase());
  if (idx === -1) return;
  players[idx]._confirmDelete = false;
  render();
}

// --- Render ---

function renderCourses(p) {
  const cc = p.currentCourse; // key "code|from"
  const bl = p.baselineCourses || {};
  const rows = (p.courses || [])
    .filter(c => (c.xp || 0) > 0)
    .sort((a,b) => {
      // Curso ativo primeiro, depois com score, depois por XP.
      const aActive = `${a.code}|${a.from}` === cc ? 1 : 0;
      const bActive = `${b.code}|${b.from}` === cc ? 1 : 0;
      if (aActive !== bActive) return bActive - aActive;
      const aHas = "score" in a ? 1 : 0;
      const bHas = "score" in b ? 1 : 0;
      if (aHas !== bHas) return bHas - aHas;
      return (b.xp || 0) - (a.xp || 0);
    })
    .map(c => {
      const isActive = `${c.code}|${c.from}` === cc;
      const delta = (c.xp || 0) - (bl[c.language] || 0);
      let progressHtml;
      if (c.score != null && c.scoreMax) {
        const pct = c.scoreMax > 0 ? Math.round((c.score / c.scoreMax) * 100) : 0;
        progressHtml = `<div class="crs-bar"><div class="crs-bar-fill" style="width:${pct}%"></div></div>
          <span class="crs-score">${c.score}/${c.scoreMax}</span>`;
      } else {
        progressHtml = `<span class="crs-xp">${fmtXP(c.xp)} XP</span>`;
      }
      const cefr = c.cefrLevel ? `<span class="crs-cefr">${esc(c.cefrLevel)}</span>` : "";
      return `<div class="crs-row ${isActive?'active':''}">
        <div class="crs-name">
          ${isActive ? '<span class="star">★</span>' : ''}
          <span class="lang">${esc(c.language)}${c.from && c.from !== '?' ? `<small>de ${esc(c.from)}</small>` : ""}</span>
          ${cefr}
        </div>
        <div class="crs-progress">
          ${progressHtml}
          <span class="crs-delta ${delta>0?'':'zero'}">${delta>0?'+':''}${fmtXP(delta)}</span>
        </div>
      </div>`;
    }).join("");
  if (!rows) return "";
  return `<div class="crs-block">
    <div class="crs-head">Cursos (${(p.courses||[]).filter(c=>(c.xp||0)>0).length})</div>
    <div class="crs-list">${rows}</div>
  </div>`;
}

function render() {
  document.getElementById("dash-count").textContent = players.length + " competidor" + (players.length !== 1 ? "es" : "");
  const empty = document.getElementById("empty");
  const podium = document.getElementById("podium");
  if (!players.length) {
    empty.classList.remove("hidden");
    podium.classList.add("hidden");
    document.getElementById("player-list").innerHTML = "";
    return;
  }
  empty.classList.add("hidden");

  const sorted = [...players].sort((a, b) => deltaXP(b) - deltaXP(a));

  if (sorted.length >= 2) {
    const icons = ["👑","🥈","🥉"];
    const h = {0: 140, 1: 100, 2: 65};
    podium.innerHTML = [1,0,2].map(idx => {
      const p = sorted[idx];
      if (!p) return '<div style="flex:1"></div>';
      return `<div class="pod pod-${idx+1}">
        <span class="pod-emoji" style="font-size:${idx===0?42:28}px">${icons[idx]}</span>
        <span class="pod-name">${esc(p.displayName||p.username)}</span>
        <span class="pod-xp">+${fmtXP(deltaXP(p))} XP</span>
        <div class="pod-bar" style="height:${h[idx]}px"><span>${idx+1}</span></div>
      </div>`;
    }).join("");
    podium.classList.remove("hidden");
  } else { podium.classList.add("hidden"); }

  const mc = ["var(--gold)","var(--silver)","var(--bronze)"];
  document.getElementById("player-list").innerHTML = sorted.map((p, i) => {
    const rankColor = i < 3 ? mc[i] : "var(--dim)";
    const updated = p.lastUpdated ? `<p class="meta">Atualizado: ${new Date(p.lastUpdated*1000).toLocaleString("pt-BR")}</p>` : "";
    const expiredBlock = p.expired ? `<div class="inline-panel">
      <p class="warn">⚠️ Sessão expirada — cole novo token</p>
      <textarea id="reauth-jwt-${esc(p.username)}" placeholder="JWT token"></textarea>
      <button class="ok-btn" onclick="submitReauth('${esc(p.username)}')">Re-autenticar</button>
    </div>` : "";
    const deleteBlock = p._confirmDelete ? `<div class="inline-panel">
      <p class="warn">Confirme com o JWT do próprio ${esc(p.username)}</p>
      <textarea id="del-jwt-${esc(p.username)}" placeholder="JWT do usuário pra confirmar"></textarea>
      <div class="row">
        <button class="cancel-btn" onclick="cancelDelete('${esc(p.username)}')">Cancelar</button>
        <button class="rm-btn" onclick="submitDelete('${esc(p.username)}')">Remover</button>
      </div>
    </div>` : "";
    const courses = renderCourses(p);
    return `<div class="card ${p.expired?'expired':''}">
      <div class="card-top">
        <div class="card-who">
          <span class="card-rank" style="color:${rankColor}">${i+1}</span>
          <div>
            <span class="card-name">${esc(p.displayName||p.username)}</span>
            <span class="card-user">@${esc(p.username)}</span>
          </div>
        </div>
        <div class="card-actions">
          <button class="btn-sm" data-r="${esc(p.username)}" onclick="refreshPlayer('${esc(p.username)}')">↻</button>
          <button class="btn-sm rm" onclick="askDelete('${esc(p.username)}')">✕</button>
        </div>
      </div>
      <div class="stats">
        <div class="stat stat-streak"><span class="stat-icon">🔥</span><span class="stat-num">${p.streak??'—'}</span><span class="stat-lbl">streak</span></div>
        <div class="stat stat-xp"><span class="stat-icon">⚡</span><span class="stat-num">+${fmtXP(deltaXP(p))}</span><span class="stat-lbl">XP ganho</span></div>
        <div class="stat"><span class="stat-icon">🌍</span><span class="stat-num">${(p.courses||[]).filter(c=>(c.xp||0)>0).length}</span><span class="stat-lbl">idiomas</span></div>
      </div>
      ${expiredBlock}
      ${deleteBlock}
      ${courses}
      ${updated}
    </div>`;
  }).join("");
}

loadArena();
</script>
</body>
</html>
